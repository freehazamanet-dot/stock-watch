name: daily-stock-watch

on:
  schedule:
    # 07:30 UTC = 16:30 JST（東証クローズ後）月〜金
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}  # 手動実行も可

permissions:
  contents: write   # 履歴スナップショットをコミットして永続化
  pages: write      # GitHub Pages へ公開
  id-token: write

concurrency:
  group: stock-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline (screen → deep → tracker → analyze → dashboard)
        run: |
          python screener.py
          python deep_screener.py
          python tracker.py
          python analyze_signals.py
          python portfolio.py
          python make_dashboard.py

      - name: Email notify (scheduled runs only)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: python notify.py

      - name: Commit snapshots back (persist history for tracking)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/*.csv history/*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "daily update ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Prepare Pages site (ダッシュボードのみ公開)
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
