name: monthly-review

on:
  schedule:
    # 毎月1日 00:00 UTC = 09:00 JST に改善レビューを生成・メール送信
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-watch-monthly
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 直近の日次実行がコミットした analysis.json / tracking.json を用いてレビュー生成＋メール送信
      - name: Generate monthly review (+email)
        run: python monthly_review.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/*.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "monthly review $(date -u +%Y-%m)"
            git push
          fi
